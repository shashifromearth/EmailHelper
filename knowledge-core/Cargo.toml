[package]
name = "eh-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Knowledge domain: people, profiles, resumes and the structure-aware ETL"

[dependencies]
pdf-extract = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
