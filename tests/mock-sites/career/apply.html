<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Careers - Data Engineer | Contoso</title>
  <style>
    .honeypot { display: none; }
    .row { margin: 10px 0; }
  </style>
</head>
<body>
  <header>
    <form class="site-search" action="/search" method="get">
      <input type="search" name="q" placeholder="Search jobs">
      <button type="submit">Search</button>
    </form>
  </header>
  <main>
    <h1>Data Engineer</h1>
    <p>Join Contoso's data platform team.</p>
    <form id="careerForm" action="/submit?ats=generic" method="post" enctype="multipart/form-data">
      <input type="hidden" name="req_id" value="DE-42">
      <input type="text" name="website_url" class="honeypot" tabindex="-1" autocomplete="off">

      <div class="row">
        <label for="fullName">Full Name *</label>
        <input id="fullName" name="full_name" type="text" required>
      </div>
      <div class="row">
        <label>Email address <input name="email" type="email" required></label>
      </div>
      <div class="row">
        <input name="mobile" type="tel" placeholder="Mobile number">
      </div>
      <div class="row">
        <div class="question-text">What is your expected CTC?</div>
        <div class="answer"><input name="expected_ctc" type="text" required></div>
      </div>
      <div class="row">
        <span id="np-label">Notice period</span>
        <select name="notice_period" aria-labelledby="np-label" aria-required="true">
          <option value="" disabled selected>Choose...</option>
          <option value="0">Immediate</option>
          <option value="15">15 days</option>
          <option value="30">30 days</option>
          <option value="60">60 days</option>
          <option value="90">90 days</option>
        </select>
      </div>
      <div class="row">
        <input name="current_location" type="text" aria-label="Current location">
      </div>
      <div class="row">
        <label for="cv">Upload CV</label>
        <input id="cv" name="cv" type="file" accept="application/pdf">
      </div>
      <div class="row">
        <textarea name="cover_letter"></textarea>
      </div>
      <div class="row">
        <input type="number">
      </div>
      <div class="row">
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
</body>
</html>
