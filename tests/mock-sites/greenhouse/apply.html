<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply - Staff AI Engineer at Acme</title>
  <style>
    .field { margin: 12px 0; }
    .visually-hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="application">
    <h2>Apply for this Job</h2>
    <form id="application_form" action="/submit?ats=greenhouse" method="post" enctype="multipart/form-data" novalidate>
      <input type="hidden" name="utf8" value="&#x2713;">
      <input type="hidden" name="job_application[job_id]" value="123">
      <div id="main_fields">
        <div class="field">
          <label for="first_name">First Name <span class="asterisk">*</span></label>
          <input type="text" id="first_name" name="job_application[first_name]" aria-required="true" maxlength="255">
        </div>
        <div class="field">
          <label for="last_name">Last Name <span class="asterisk">*</span></label>
          <input type="text" id="last_name" name="job_application[last_name]" aria-required="true" maxlength="255">
        </div>
        <div class="field">
          <label for="email">Email <span class="asterisk">*</span></label>
          <input type="email" id="email" name="job_application[email]" aria-required="true">
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="job_application[phone]">
        </div>
        <div class="field" id="resume_fieldset">
          <label for="resume">Resume/CV <span class="asterisk">*</span></label>
          <div class="attach-or-paste">
            <input type="file" id="resume" name="job_application[resume]" class="visually-hidden-file" accept=".pdf,.doc,.docx,.txt,.rtf" required>
            <button type="button" onclick="document.getElementById('resume').click()">Attach</button>
            <span id="resume_filename" class="filename"></span>
          </div>
        </div>
      </div>

      <div id="custom_fields">
        <div class="field">
          <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
          <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]">
        </div>
        <div class="field">
          <label for="job_application_answers_attributes_1_boolean_value">Are you legally authorized to work in India? <span class="asterisk">*</span></label>
          <select id="job_application_answers_attributes_1_boolean_value" name="job_application[answers_attributes][1][boolean_value]">
            <option value="">Please select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>
        <div class="field">
          <label for="job_application_answers_attributes_2_text_value">Why do you want to join Acme? <span class="asterisk">*</span></label>
          <textarea id="job_application_answers_attributes_2_text_value" name="job_application[answers_attributes][2][text_value]" rows="5"></textarea>
        </div>
      </div>

      <div id="eeoc_fields">
        <h3>U.S. Equal Employment Opportunity Information</h3>
        <div class="field">
          <label for="job_application_gender">Gender</label>
          <select id="job_application_gender" name="job_application[gender]">
            <option value="">Please select</option>
            <option value="1">Male</option>
            <option value="2">Female</option>
            <option value="3">Decline To Self Identify</option>
          </select>
        </div>
        <div class="field">
          <label for="job_application_veteran_status">Veteran Status</label>
          <select id="job_application_veteran_status" name="job_application[veteran_status]">
            <option value="">Please select</option>
            <option value="1">I am not a protected veteran</option>
            <option value="2">I identify as one or more of the classifications of protected veteran</option>
            <option value="3">I don't wish to answer</option>
          </select>
        </div>
      </div>

      <div id="submit_buttons">
        <input type="submit" id="submit_app" value="Submit Application">
      </div>
    </form>
  </div>
  <script>
    document.getElementById('resume').addEventListener('change', function () {
      var f = this.files && this.files[0];
      document.getElementById('resume_filename').textContent = f ? f.name : '';
    });
  </script>
</body>
</html>
