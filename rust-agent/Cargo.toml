[package]
name = "emailhelper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first AI email, job application and research agent orchestrator"

[lib]
name = "emailhelper"
path = "src/lib.rs"

[[bin]]
name = "emailhelper"
path = "src/main.rs"

[dependencies]
eh-knowledge = { path = "../knowledge-core" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
futures = { version = "0.3", default-features = false, features = ["std"] }
prometheus = { version = "0.13", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
wiremock = "0.6"
http-body-util = "0.1"
