<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmailHelper Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --border: #dfe3e8;
    --accent: #2f6fde; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0362c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #98a2b3; --border: #2c3340;
      --accent: #6c9cff; --ok: #4cc38a; --warn: #f0b44c; --bad: #ff7a6e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  main { padding: 18px 20px; max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .tile, section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .l { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .scroll { overflow-x: auto; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
  .s-submitted, .s-applied { color: var(--ok); border-color: var(--ok); }
  .s-blocked, .s-awaiting_human, .s-awaiting_approval { color: var(--warn); border-color: var(--warn); }
  .s-failed { color: var(--bad); border-color: var(--bad); }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button { cursor: pointer; }
  #err { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } header { flex-wrap: wrap; gap: 8px; } }
</style>
</head>
<body>
<header>
  <h1>EmailHelper</h1>
  <div><span id="err"></span> <input id="token" type="password" placeholder="API token" size="18"> <button id="save">Connect</button> <button id="refresh">Refresh</button> <button id="reindex" title="Re-read the knowledge folder: chunk, embed and index new or changed documents">Re-index knowledge</button></div>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <p class="muted" id="kstatus"></p>
  <p class="muted" id="lstatus"></p>
  <p class="muted" id="astatus"></p>
  <section><h2>Waiting for you</h2><div class="scroll" id="questions"></div></section>
  <section><h2>Applications</h2><div class="scroll" id="apps"></div></section>
  <section id="unassigned-section" hidden><h2>Mailboxes not in people.json (classified only, no drafts)</h2><div class="scroll" id="unassigned"></div></section>
  <div class="grid2">
    <section><h2>Top jobs</h2><div class="scroll" id="jobs"></div></section>
    <section><h2>Company pipeline</h2><div class="scroll" id="companies"></div></section>
  </div>
  <section><h2>Recruiters</h2><div class="scroll" id="recruiters"></div></section>
</main>
<script>
(function () {
  "use strict";
  var KEY = "eh_token";
  function getToken() { try { return sessionStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { sessionStorage.setItem(KEY, t); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function link(u, t) { return u && /^https?:\/\//.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(t || u) + '</a>' : esc(t || ""); }
  function pill(s) { return '<span class="pill s-' + esc(s) + '">' + esc(s) + '</span>'; }
  function table(cols, rows) {
    if (!rows.length) return '<p class="muted">Nothing yet.</p>';
    return '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join("") + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table>';
  }
  function tile(v, l) { return '<div class="tile"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }

  async function load() {
    var err = document.getElementById("err");
    err.textContent = "";
    var t = getToken();
    if (!t) { err.textContent = "Enter the API token (EH_API_TOKEN)."; return; }
    var res;
    try { res = await fetch("/api/v1/dashboard", { headers: { "X-EmailHelper-Token": t } }); }
    catch (e) { err.textContent = "Agent unreachable."; return; }
    if (res.status === 401) { err.textContent = "Invalid token."; return; }
    if (!res.ok) { err.textContent = "Error " + res.status; return; }
    var d = await res.json();
    var p = d.pipeline || {};
    document.getElementById("tiles").innerHTML =
      tile(d.emails_processed, "Emails processed") + tile((d.drafts || {}).total, "Drafts created") +
      tile((d.drafts || {}).review_required, "Drafts needing review") + tile(p.applied, "Applied") +
      tile(p.in_progress, "In progress") + tile(p.blocked, "Blocked") + tile(p.awaiting_approval, "Awaiting approval") +
      tile(p.failed, "Failed") + tile(d.interviews, "Interviews") + tile((d.recruiters || []).length, "Recruiters");
    // Don't wipe an answer the user is typing during the periodic refresh.
    var typing = document.activeElement && document.activeElement.classList.contains("ans-input");
    if (!typing) document.getElementById("questions").innerHTML = table(["Ref", "For", "Question", "Reason", "Your answer"],
      (d.questions || []).map(function (q) {
        var attrs = ' data-q="' + esc(q.id) + '"';
        var control;
        if (q.field_id === "__approve__") {
          control = '<button class="ans-btn" data-value="submit"' + attrs + '>Submit application</button> ' +
                    '<button class="ans-btn" data-value="skip"' + attrs + '>Skip</button>';
        } else {
          var list = (q.options || []).length ? ' list="opts-' + esc(q.id) + '"' : "";
          var dl = (q.options || []).length ? '<datalist id="opts-' + esc(q.id) + '">' +
            q.options.map(function (o) { return '<option value="' + esc(o) + '">'; }).join("") + '</datalist>' : "";
          var hint = q.field_id === "__blocker__" ? "done" : "type your answer";
          control = '<input class="ans-input" id="ans-' + esc(q.id) + '"' + list + ' placeholder="' + hint + '" size="28">' + dl +
                    ' <button class="ans-btn" data-input="ans-' + esc(q.id) + '"' + attrs + '>Send</button>' +
                    ' <button class="ans-btn" data-value="skip"' + attrs + '>Skip</button>';
        }
        return [esc(q.ref_code), esc(q.person || "-"), esc(q.question), esc(q.reason), control];
      }));
    var un = d.unassigned_mailboxes || [];
    document.getElementById("unassigned-section").hidden = un.length === 0;
    document.getElementById("unassigned").innerHTML = table(["Mailbox", "Emails", "Last seen"],
      un.map(function (u) { return [esc(u.mailbox), esc(u.emails), esc(u.last_seen)]; }));
    document.getElementById("apps").innerHTML = table(["For", "Company", "Role", "Status", "Step / blocker", "Resume", "Score", "Updated"],
      (d.applications || []).map(function (a) {
        return [esc(a.person || "-"), esc(a.company), link(a.url, a.role), pill(a.status), esc(a.blocker ? a.blocker + ": " + (a.blocker_detail || "") : (a.step || "")), esc(a.resume || "-"),
          '<span class="num">' + esc(a.score) + '</span>', esc(a.updated_at)];
      }));
    document.getElementById("jobs").innerHTML = table(["Score", "Role", "Company", "Where", "Decision", "Status"],
      (d.jobs || []).slice(0, 25).map(function (j) {
        return ['<span class="num">' + esc(j.score) + '</span>', link(j.url, j.title), esc(j.company), esc([j.location, j.remote].filter(Boolean).join(" · ")), esc(j.decision), pill(j.status)];
      }));
    var cp = d.company_pipeline || {};
    document.getElementById("companies").innerHTML = table(["Company", "Statuses"],
      Object.keys(cp).map(function (k) { return [esc(k), Object.keys(cp[k]).map(function (s) { return pill(s) + " " + esc(cp[k][s]); }).join(" ")]; }));
    document.getElementById("recruiters").innerHTML = table(["Name", "Title", "Company", "Contact", "Rank", "Source"],
      (d.recruiters || []).map(function (r) { return [esc(r.name), esc(r.title), esc(r.company), r.linkedin_url ? link(r.linkedin_url, "LinkedIn") : esc(r.email), esc(r.rank_score), esc(r.source)]; }));
  }
  // Answer human-in-the-loop questions (same effect as a Telegram reply).
  document.getElementById("questions").addEventListener("click", async function (ev) {
    var b = ev.target.closest ? ev.target.closest(".ans-btn") : null;
    if (!b) return;
    var value = b.getAttribute("data-value");
    if (!value) {
      var input = document.getElementById(b.getAttribute("data-input"));
      value = input ? input.value.trim() : "";
    }
    if (!value) return;
    b.disabled = true;
    var err = document.getElementById("err");
    try {
      var res = await fetch("/api/v1/questions/" + encodeURIComponent(b.getAttribute("data-q")) + "/answer", {
        method: "POST",
        headers: { "X-EmailHelper-Token": getToken(), "Content-Type": "application/json" },
        body: JSON.stringify({ answer: value })
      });
      var body = await res.json().catch(function () { return {}; });
      err.textContent = res.ok ? (body.message || "Answer sent.") : ("Error: " + (body.message || res.status));
    } catch (e) {
      err.textContent = "Agent unreachable.";
    }
    setTimeout(load, 800);
  });
  document.getElementById("save").addEventListener("click", function () { setToken(document.getElementById("token").value.trim()); load(); });
  document.getElementById("refresh").addEventListener("click", load);
  async function knowledgeStatus() {
    var el = document.getElementById("kstatus");
    try {
      var res = await fetch("/api/v1/knowledge/status", { headers: { "X-EmailHelper-Token": getToken() } });
      if (!res.ok) { el.textContent = "Knowledge service: unavailable (drafts use the local keyword index)."; return; }
      var d = await res.json(), ix = d.index || {};
      var emb = (ix.embedded || []).map(function (e) { return e[0] + " " + e[1] + "/" + ix.chunks; }).join(", ");
      el.textContent = "Knowledge: " + ix.documents + " documents, " + ix.chunks + " chunks; embedded " + (emb || "none") +
        (d.running ? "; indexing now…" : "") + (ix.last_etl ? "; last run " + new Date(ix.last_etl).toLocaleString() : "");
    } catch (e) { el.textContent = ""; }
  }
  async function linksStatus() {
    var el = document.getElementById("lstatus");
    try {
      var res = await fetch("/api/v1/job-links/status", { headers: { "X-EmailHelper-Token": getToken() } });
      if (!res.ok) { el.textContent = ""; return; }
      var d = await res.json(), parts = function (o) { return Object.keys(o || {}).filter(function (k) { return o[k]; }).map(function (k) { return k + " " + o[k]; }).join(", "); };
      el.textContent = "Job database: " + d.total + " jobs (" + (parts(d.by_status) || "empty") + ")" + (d.total ? "; by site: " + parts(d.by_platform) : "");
    } catch (e) { el.textContent = ""; }
  }
  // Chrome extension applier: what keeps failing, and where.
  async function applierStatus() {
    var el = document.getElementById("astatus");
    try {
      var res = await fetch("/api/v1/apply/events/summary?days=7", { headers: { "X-EmailHelper-Token": getToken() } });
      if (!res.ok) { el.textContent = ""; return; }
      var d = await res.json(), k = d.by_kind || {};
      var kinds = Object.keys(k).filter(function (x) { return x !== "applied" && k[x]; }).map(function (x) { return x + " " + k[x]; });
      var top = (d.top || []).slice(0, 3).map(function (t) {
        var where = [t.platform, t.field].filter(Boolean).join(" · ");
        return (where ? where + ": " : "") + t.reason + " (" + t.count + ")";
      });
      el.textContent = kinds.length ? "Applier problems (7 days): " + kinds.join(", ") + (top.length ? "; top: " + top.join("; ") : "") : "";
    } catch (e) { el.textContent = ""; }
  }
  document.getElementById("reindex").addEventListener("click", async function () {
    var err = document.getElementById("err");
    try {
      var res = await fetch("/api/v1/knowledge/reindex", { method: "POST", headers: { "X-EmailHelper-Token": getToken() } });
      var body = await res.json().catch(function () { return {}; });
      err.textContent = res.ok ? (body.status === "already_running" ? "Indexing is already running." : "Indexing started.") : ("Error: " + (body.message || res.status));
    } catch (e) { err.textContent = "Agent unreachable."; }
    setTimeout(knowledgeStatus, 1500);
  });
  knowledgeStatus();
  linksStatus();
  applierStatus();
  setInterval(function () { knowledgeStatus(); linksStatus(); applierStatus(); }, 60000);
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
