<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EmailHelper</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
      body { width: 360px; padding: 12px; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      h1 { font-size: 15px; margin: 0; flex: 1; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
      .job { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
      .job h2 { font-size: 14px; margin: 0 0 2px; }
      .muted { color: var(--muted); }
      ul { margin: 6px 0 0; padding-left: 18px; }
      #reason { width: 100%; margin-top: 8px; padding: 5px 8px; font: inherit; border: 1px solid var(--border); border-radius: 4px; background: var(--field); color: var(--fg); }
      footer { display: flex; justify-content: space-between; margin-top: 10px; color: var(--muted); font-size: 12px; }
    </style>
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <h1>Job applier</h1>
      <span id="queue" class="pill">queue: –</span>
    </header>

    <div class="row">
      <button id="start" class="primary" type="button">Start</button>
      <button id="pause" type="button" hidden>Pause</button>
      <button id="fill" type="button" title="Alt+Shift+F">Fill this page</button>
    </div>

    <div id="message" class="warning" hidden></div>
    <div id="paused" class="warning" hidden></div>

    <section id="job" class="job" hidden>
      <h2 id="title"></h2>
      <div id="meta" class="muted"></div>
      <p id="status"></p>
      <p id="waiting" hidden></p>
      <div id="details" class="muted"></div>
      <ul id="asks"></ul>
      <input id="reason" placeholder="Reason for Skip / Failed (optional)">
      <div class="row">
        <button id="applied" class="primary" type="button">Applied</button>
        <button id="skip" type="button">Skip</button>
        <button id="failed" type="button">Failed</button>
      </div>
    </section>

    <footer>
      <span id="mode">You always submit; passwords and checks stay with you.</span>
      <a href="#" id="options">Settings</a>
    </footer>
  </body>
</html>
